  <!-- ══════════════════════════════════════════════════════
       ★ 数据填写区（只改这里！改文字即可）★
       照片怎么放：把图片文件拖进 assets/media/ 文件夹（没有就新建），
       然后填相对路径，如 "assets/media/2026-11-15.jpg"（可放多张）。
       视频怎么放：上传 B 站后，把 BV 号填进 video（如 "BV1Qo4y1U7yN"）。
       ══════════════════════════════════════════════════════ -->
  <script>
  /* ── 生活记录 ──
     推荐用「管理终端 admin.html → 🏡 生活记录」可视化填写（照片选文件自动上传）。
     手动改也可以：date 日期 / title 标题 / mood 心情 / body 正文（\n 换行）/ imgs 照片路径数组 / video B站BV号 */
  /* LIFE:AUTO START（本区块由管理终端读写，手动修改会在下次保存时被覆盖） */
  var LIFE_POSTS = [
    {
      "date": "2026-11-17",
      "title": "宝可梦",
      "mood": "快乐",
      "body": "",
      "imgs": [
        "assets/media/2026-11-17-128050557_p0_master1200-1.jpg"
      ],
      "video": ""
    },
    {
      "date": "2026-11-15",
      "title": "信号站全面升级完成",
      "mood": "激动",
      "body": "两天时间：上线、评论、归档、游戏档案、日程系统，还有一缸会动的宝可梦。\n接下来该好好备考了……写完这条就去刷行测。",
      "imgs": [],
      "video": ""
    },
    {
      "date": "2026-11-14",
      "title": "深夜单曲循环「上岸の小曲」",
      "mood": "平静",
      "body": "备考间隙刷到了这首曲子，一遍就停不下来——八千里路明月照，就当是给自己的进行曲。\n距离国考还有两周，听完这首，继续刷题。",
      "imgs": [],
      "video": "BV1uQh463E7B"
    }
  ];
  /* LIFE:AUTO END */

  /* ── ⚔ 赌约墙（和舍友老季的五年之约）──
     到期后手动改 status 和 result 宣布赢家：status: "已开盘", result: "赢家：麦茶（老季请客 🍜）" */
  var BET_DATA = {
    title: "俄乌停战预测之赌",
    left: { name: "麦茶", view: "5 年内，俄罗斯和乌克兰无法达成停战" },
    right: { name: "老季", view: "5 年内，俄乌双方会达成停战" },
    stake: "输的人请赢家吃一顿大餐 🍜",
    startDate: "2026-11-19",
    endDate: "2031-11-19",
    status: "进行中",
    result: ""
  };
  </script>
  <!-- ═══════════════ 数据填写区结束 ═══════════════ -->

  <script>
  (function () {
    "use strict";
    function el(tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined && text !== null) e.textContent = text;
      return e;
    }

    var MOOD_COLORS = {
      "快乐": "#f0c75e", "充实": "#5cb85c", "激动": "#e56c3c",
      "摸鱼": "#74848a", "丧": "#6a5aa8", "平静": "#39c5bb"
    };
    function moodEl(m) {
      var c = MOOD_COLORS[m] || "#74848a";
      var s = el("span", "life-mood", (MOOD_COLORS[m] ? "" : "🌀 ") + (m || "日常"));
      s.style.color = c;
      s.style.borderColor = c;
      s.style.background = c + "2b";
      return s;
    }

    var box = document.getElementById("lifeTimeline");
    (window.LIFE_POSTS || []).forEach(function (post) {
      var node = el("div", "life-node");

      var dotRow = el("div", "life-dotrow");
      dotRow.appendChild(el("span", "life-dot"));
      var head = el("div", "life-head");
      head.appendChild(el("span", "life-date", post.date || ""));
      head.appendChild(moodEl(post.mood));
      dotRow.appendChild(head);
      node.appendChild(dotRow);

      var card = el("div", "life-card");
      card.appendChild(el("h3", "life-title", post.title || ""));
      if (post.body) {
        var body = el("div", "life-body");
        String(post.body).split("\n").forEach(function (line, i2, arr2) {
          body.appendChild(document.createTextNode(line));
          if (i2 < arr2.length - 1) { body.appendChild(el("br")); }
        });
        card.appendChild(body);
      }
      if (post.imgs && post.imgs.length) {
        var imgs = el("div", "life-imgs");
        post.imgs.forEach(function (src) {
          var a = el("a", "life-imgbox");
          a.href = src;
          a.target = "_blank";
          a.rel = "noopener";
          var im = document.createElement("img");
          im.src = src;
          im.loading = "lazy";
          im.alt = "生活照片";
          im.addEventListener("error", function () {
            a.classList.add("broken");
            a.textContent = "照片加载失败：" + src;
          });
          a.appendChild(im);
          imgs.appendChild(a);
        });
        card.appendChild(imgs);
      }
      if (post.video && /^BV[0-9A-Za-z]+$/.test(post.video)) {
        var vwrap = el("div", "life-video");
        var iframe = document.createElement("iframe");
        iframe.dataset.bvid = post.video; /* src 由 IntersectionObserver 滚动到位后再加载 */
        iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-popups allow-popups-to-escape-sandbox");
        iframe.setAttribute("scrolling", "no");
        iframe.setAttribute("frameborder", "no");
        iframe.allowFullscreen = true;
        vwrap.appendChild(iframe);
        /* 顶部盖板：挡住标题横幅的跳转链接；iframe 沙箱兜底保证页面永不跳走 */
        vwrap.appendChild(el("div", "life-video-cover top"));
        card.appendChild(vwrap);
      }
      node.appendChild(card);
      box.appendChild(node);
    });
    if (!box.children.length) { box.appendChild(el("div", "sc-empty", "> 时间轴空空如也——去「数据填写区」记录第一条_")); }

    /* ── ⚔ 赌约墙 ── */
    var betBox = document.getElementById("betPanel");
    if (betBox && window.BET_DATA) {
      var B = window.BET_DATA;
      function bParse(s) {
        var p = String(s || "").split("-");
        return p.length === 3 ? new Date(+p[0], +p[1] - 1, +p[2]) : null;
      }
      var bs = bParse(B.startDate), be = bParse(B.endDate);
      var now3 = new Date();
      var t0 = new Date(now3.getFullYear(), now3.getMonth(), now3.getDate());
      var leftDays = be ? Math.round((be - t0) / 86400000) : 0;
      var gonePct = bs && be && be > bs ? Math.min(100, Math.max(0, Math.round(((t0 - bs) / (be - bs)) * 100))) : 0;

      var panel = el("div", "bet-panel");
      var head = el("div", "bet-head");
      head.appendChild(el("span", "bet-title", "⚔ " + (B.title || "赌约")));
      head.appendChild(el("span", "bet-status", B.status || "进行中"));
      panel.appendChild(head);

      var vs = el("div", "bet-vs");
      var sl = el("div", "bet-side me");
      sl.appendChild(el("div", "bet-name", "◆ " + (B.left.name || "")));
      sl.appendChild(el("div", "bet-view", B.left.view || ""));
      vs.appendChild(sl);
      vs.appendChild(el("div", "bet-bolt", "⚡"));
      var sr = el("div", "bet-side");
      sr.appendChild(el("div", "bet-name", "◆ " + (B.right.name || "")));
      sr.appendChild(el("div", "bet-view", B.right.view || ""));
      vs.appendChild(sr);
      panel.appendChild(vs);

      panel.appendChild(el("div", "bet-stake", "赌注：" + (B.stake || "")));

      var datesRow = el("div", "bet-dates");
      datesRow.appendChild(el("span", null, "立约 " + (B.startDate || "")));
      datesRow.appendChild(el("span", null, "开盘 " + (B.endDate || "")));
      panel.appendChild(datesRow);
      var track = el("div", "bet-track");
      var fill = el("div", "bet-fill");
      fill.style.width = gonePct + "%";
      track.appendChild(fill);
      panel.appendChild(track);

      var crow = el("div", "bet-count-row");
      if (leftDays > 0) {
        crow.appendChild(el("span", "bet-count", String(leftDays)));
        crow.appendChild(el("span", "bet-count-unit", "天后开盘 · 五年之约已履行 " + gonePct + "%"));
      } else if (leftDays === 0) {
        crow.appendChild(el("span", "bet-count", "今天"));
        crow.appendChild(el("span", "bet-count-unit", "开盘日 · 见证时刻到了"));
      } else {
        crow.appendChild(el("span", "bet-count", "已开盘"));
        crow.appendChild(el("span", "bet-count-unit", Math.abs(leftDays) + " 天前到期"));
      }
      panel.appendChild(crow);

      if (B.result) {
        panel.appendChild(el("div", "bet-result", "🏆 " + B.result));
      } else if (leftDays < 0) {
        panel.appendChild(el("div", "bet-result", "已到开盘日——该请客的请客，该立新赌约的立新赌约。"));
      }
      betBox.appendChild(panel);
    }

    /* B 站播放器惰性加载：滚动到附近才真正拉起 iframe，不拖慢页面 */
    var vio = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          var fr = en.target.querySelector("iframe");
          if (fr && !fr.src && fr.dataset.bvid) {
            fr.src = "https://player.bilibili.com/player.html?bvid=" + fr.dataset.bvid + "&autoplay=0&danmaku=0&high_quality=1";
          }
          vio.unobserve(en.target);
        }
      });
    }, { rootMargin: "300px" });
    Array.prototype.forEach.call(document.querySelectorAll(".life-video"), function (v) {
      vio.observe(v);
    });
  })();
  </script>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/bg-pokemon.js"></script>
</body>
